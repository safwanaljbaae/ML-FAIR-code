[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-fair"
version = "1.0.0"
description = "Machine-Learning-Assisted FAIR Analysis of Mean Motion Resonances"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ML-FAIR Contributors"},
]
dependencies = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "rebound>=3.0",
    "scipy>=1.10",
    "scikit-learn>=1.0",
    "tqdm>=4.0",
    "angles>=0.0.4",
]

[project.urls]
Homepage = "https://github.com/yourusername/ML-FAIR"